# Prometheus scrapes the collector's metrics and evaluates alerts.yml. It sends alerts nowhere: add
# your Alertmanager under `alerting`, or read them on its Alerts page.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: collector
    static_configs:
      - targets: ["collector:8889"]
