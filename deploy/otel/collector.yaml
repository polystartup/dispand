# OpenTelemetry Collector: receives what Dispand exports over OTLP/HTTP (OTEL_EXPORTER_OTLP_ENDPOINT
# points here) and hands each signal on: metrics to Prometheus, traces to Jaeger, logs to its own
# output (the app prints them too).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:
    # Prometheus's usual names, as its own OTLP receiver also gives them: dots become underscores,
    # a counter ends in `_total` and a duration in `_milliseconds` (`dispand.model.calls` is
    # `dispand_model_calls_total`). alerts.yml and the dashboard use these.
    endpoint: 0.0.0.0:8889
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
