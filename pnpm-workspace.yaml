packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@electric-sql/pglite@0.5.15'
  - '@tailwindcss/node@4.3.4'
  - '@tailwindcss/oxide-android-arm64@4.3.4'
  - '@tailwindcss/oxide-darwin-arm64@4.3.4'
  - '@tailwindcss/oxide-darwin-x64@4.3.4'
  - '@tailwindcss/oxide-freebsd-x64@4.3.4'
  - '@tailwindcss/oxide-linux-arm-gnueabihf@4.3.4'
  - '@tailwindcss/oxide-linux-arm64-gnu@4.3.4'
  - '@tailwindcss/oxide-linux-arm64-musl@4.3.4'
  - '@tailwindcss/oxide-linux-x64-gnu@4.3.4'
  - '@tailwindcss/oxide-linux-x64-musl@4.3.4'
  - '@tailwindcss/oxide-wasm32-wasi@4.3.4'
  - '@tailwindcss/oxide-win32-arm64-msvc@4.3.4'
  - '@tailwindcss/oxide-win32-x64-msvc@4.3.4'
  - '@tailwindcss/oxide@4.3.4'
  - '@tailwindcss/vite@4.3.4'
  - tailwindcss@4.3.4
allowBuilds:
  esbuild: true
overrides:
  # drizzle-kit 0.31 still pulls esbuild ~0.18 through @esbuild-kit/core-utils (GHSA-67mh-4wv8-2f99).
  # Remove once drizzle-kit no longer depends on @esbuild-kit/esm-loader.
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
  # eslint, @eslint/config-array and @typescript-eslint/typescript-estree still ask for minimatch ^10
  # (GHSA-g3hv-75wg-m249, fixed in 11.0.1); they only use new Minimatch() and match(), which 11 keeps.
  # Remove once they depend on minimatch ^11.
  minimatch: ^11.0.1
