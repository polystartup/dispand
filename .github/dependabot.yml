# Dependabot version updates, weekly. Updates wait 7 days after a release (cooldown), so a
# compromised or broken release is usually pulled before it reaches us. Updates come grouped, one
# pull request per ecosystem. Only a major update of an npm package comes alone: each one is its
# own migration.
# Add an entry when the product gets a new kind of dependency file (a Dockerfile...).
version: 2
updates:
  - package-ecosystem: npm # pnpm lockfile
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      compose:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
