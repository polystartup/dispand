name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The commit the release is tagged at: what every release build checks out (a tag can move).
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The runner images, tagged with the version (`runner-images.yml`).
  runner-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # What the called workflow's publish job asks for, attestations included.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/runner-images.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}

  # A release made with GITHUB_TOKEN does not trigger other workflows, so the release image
  # (both platforms, tagged with the version) is published here (`publish.yml`).
  publish-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # What the called workflow's jobs ask for, attestations included.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}

  # The runner's VM images, attached to the release (`deploy-runner-images.yml`).
  runner-vm-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-runner-images.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
