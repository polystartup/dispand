name: Node CI

# Reusable CI, called from ci.yml. Its job is reported as "ci / Check", the required check.
# Tool versions come from .mise.toml. The root package.json has the lint, typecheck, test and
# build scripts (a missing one fails the check, so it can't be skipped silently).

on:
  workflow_call:
    inputs:
      e2e:
        description: Also run the Playwright tests (script test:e2e)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: End-to-end tests
        if: inputs.e2e
        run: |
          # Chromium's system packages come from Ubuntu's mirror. When it can't be reached, the
          # browser alone still runs: the runner image already has Chrome's libraries.
          pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium
          pnpm run test:e2e
