name: Dependency review

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # The licences of everything we depend on today (GitHub's dependency graph): a new one
          # fails the review until it is added here, after a look at what shipping it asks of us.
          allow-licenses: >-
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause, CC-BY-4.0,
            CC0-1.0, ISC, JSON, MIT, MIT-0, MPL-2.0, OFL-1.1, Python-2.0, Unlicense
          # Anthropic's packages, whose licence isn't an SPDX one ("SEE LICENSE IN README.md"): Claude
          # Code, which no image holds (the runner installs it at its first start), and the Agent SDK,
          # which the runner bundles.
          allow-dependencies-licenses: >-
            pkg:npm/%40anthropic-ai/claude-code,
            pkg:npm/%40anthropic-ai/claude-code-darwin-arm64,
            pkg:npm/%40anthropic-ai/claude-code-darwin-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64-musl,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64-musl,
            pkg:npm/%40anthropic-ai/claude-code-win32-arm64,
            pkg:npm/%40anthropic-ai/claude-code-win32-x64,
            pkg:npm/%40anthropic-ai/claude-agent-sdk,
            pkg:npm/%40anthropic-ai/claude-agent-sdk-darwin-arm64,
            pkg:npm/%40anthropic-ai/claude-agent-sdk-darwin-x64,
            pkg:npm/%40anthropic-ai/claude-agent-sdk-linux-arm64,
            pkg:npm/%40anthropic-ai/claude-agent-sdk-linux-arm64-musl,
            pkg:npm/%40anthropic-ai/claude-agent-sdk-linux-x64,
            pkg:npm/%40anthropic-ai/claude-agent-sdk-linux-x64-musl,
            pkg:npm/%40anthropic-ai/claude-agent-sdk-win32-arm64,
            pkg:npm/%40anthropic-ai/claude-agent-sdk-win32-x64
