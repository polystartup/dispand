name: Publish

# The app image, for amd64 and arm64: each platform is built and smoke-tested on a runner of its
# own architecture (arm64 under emulation took about 15 minutes, natively 2), then pushed by
# digest; `merge` names both under one index, tagged `latest` and `sha-<sha>` from main, or
# `<version>` for a release (called from release-please.yml), and attests it.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: The release tag (v<version>), published as <version>.
        type: string
        required: true
      sha:
        description: The commit the release is tagged at, which is built (a tag can move).
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # amd64 keeps the cache pull requests' smoke tests read; it alone checks the migrations over
          # the published image's schema, which is the same on both platforms.
          - { platform: linux/amd64, arch: amd64, runs-on: ubuntu-latest, cache: type=gha, previous: true }
          - { platform: linux/arm64, arch: arm64, runs-on: ubuntu-24.04-arm, cache: "type=gha,scope=arm64", previous: false }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release's commit; main's push otherwise.
          ref: ${{ inputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image must start and migrate (on an empty database and over `latest`'s) before it is
      # pushed: installs follow `latest`. The push below reuses this build's layers.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: dispand:smoke
          cache-from: ${{ matrix.cache }}
      # Over `latest`'s schema on main only: a release's commit may be older than `latest`.
      - run: .github/smoke-app-image.sh dispand:smoke ${{ matrix.previous && inputs.tag == '' && format('ghcr.io/{0}:latest', github.repository) || '' }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
      # By digest only: `merge` tags the index once both platforms are pushed.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # An SBOM attached to the image, beside the provenance buildx attaches by default.
          sbom: true
          # Saved for the next runs, pull requests' smoke tests included.
          cache-to: ${{ matrix.cache }},mode=max
      - run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signed build provenance (`actions/attest`): its OIDC token, the attestation and its storage record.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.tag == '' }}
            type=sha,prefix=sha-,enable=${{ inputs.tag == '' }}
            type=match,pattern=v(.*),group=1,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
      - id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do args+=(-t "$tag"); done <<<"$TAGS"
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          # The digest this push made, never one read back through a tag another run may have moved.
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index.json" "${args[@]}"
          echo "digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")" >>"$GITHUB_OUTPUT"
      # Signed build provenance of the index, kept by GitHub and pushed beside the image.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
