name: App image

# Builds the app image and starts it (.github/smoke-app-image.sh) on pull requests that can change
# it. publish.yml runs the same test before pushing `latest`. Builds it once more with the fixture
# web shell, as an embedding build would (.github/shell-fixture-check.sh).

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - apps/**
      - packages/**
      - .github/smoke-app-image.sh
      - .github/shell-fixture-check.sh
      - .github/workflows/app-image.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: dispand:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: .github/smoke-app-image.sh dispand:smoke ghcr.io/${{ github.repository }}:latest

  shell:
    name: Web shell fixture build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: dispand:shell
          build-args: DISPAND_WEB_SHELL=src/shell/fixture.tsx
          cache-from: type=gha
      # The repository's Node, which reads the page policy from its TypeScript source.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: .github/shell-fixture-check.sh dispand:shell
