name: Deploy runner

# deploy/runner/cloud-init.sh, run on the job's VM with the supervisor image built from this
# commit (tagged as the name the script runs, so it isn't pulled): gVisor is registered, the
# supervisor waits for pairing with the Docker socket, and a second run changes nothing.
on:
  pull_request:
    paths:
      - deploy/runner/**
      - apps/runner/**
      - .github/workflows/deploy-runner.yml

permissions:
  contents: read

jobs:
  cloud-init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/runner/worker/Dockerfile
          load: true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/runner/Dockerfile
          build-args: WORKER_IMAGE=ghcr.io/polystartup/dispand-runner-worker@${{ steps.worker.outputs.digest }}
          load: true
          tags: ghcr.io/polystartup/dispand-runner:latest
      - name: First run
        run: sudo deploy/runner/cloud-init.sh
      - name: gVisor is registered and runs a container
        run: |
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'
          docker run --rm --runtime runsc ghcr.io/polystartup/dispand-runner:latest true
      - name: The supervisor waits for pairing, can reach the Docker socket and knows the host's addresses
        run: |
          for _ in $(seq 60); do docker logs dispand-runner 2>&1 | grep -q "not paired yet" && break; sleep 1; done
          docker logs dispand-runner 2>&1 | grep -q "not paired yet"
          [ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' dispand-runner)" = "true 0" ]
          docker exec dispand-runner sh -c 'test "$(id -u)" != 0 && test -w /var/run/docker.sock'
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' dispand-runner | grep -q '^DISPAND_HOST_ADDRESSES=.'
      - name: A second run changes nothing
        run: |
          state() { docker inspect -f '{{.Id}} {{.State.StartedAt}} {{.RestartCount}}' dispand-runner; sudo sha256sum /etc/docker/daemon.json /etc/apt/sources.list.d/*; }
          before="$(state)"
          sudo deploy/runner/cloud-init.sh
          [ "$(state)" = "$before" ]
